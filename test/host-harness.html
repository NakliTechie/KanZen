<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KanZen NakliOS storage harness</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;grid-template-rows:auto minmax(0,1fr);background:#202522;color:#f5f1e8;font:12px ui-monospace,monospace}
    header{display:flex;align-items:center;gap:10px;padding:8px 12px}
    button{font:inherit;padding:5px 9px}
    [data-state="pass"]{color:#91d7a3}[data-state="fail"]{color:#ff9b8d}
    iframe{width:100%;height:100%;border:0;background:white}
  </style>
</head>
<body>
<header>
  <button id="run" type="button">Run storage + live-update + import-safety regression</button>
  <span id="status" role="status">Ready</span>
</header>
<iframe id="app" title="KanZen test app" src="../index.html"></iframe>
<script>
(()=>{
  const frame=document.getElementById('app');
  const run=document.getElementById('run');
  const status=document.getElementById('status');
  const stamp='2026-07-28T00:00:00.000Z';
  const board=(id,name)=>JSON.stringify({
    _meta:{boardId:id,lastModified:stamp,kanzenVersion:1,filename:name.toLowerCase().replaceAll(' ','-')+'.kanzen.json',teamMode:false},
    id,name,createdAt:stamp,members:[],labels:[],
    columns:[{id:id+'-todo',name:'To do',cardIds:[],wipLimit:null}],
    cards:{},activity:[],
  },null,2);
  const teamBoard=JSON.stringify({
    _meta:{boardId:'crate-board',lastModified:stamp,kanzenVersion:1,teamMode:true},
    id:'crate-board',name:'Crate Board',createdAt:stamp,members:[],labels:[],
    columns:[{id:'crate-todo',name:'To do',cardIds:['crate-card','crate-card-2'],wipLimit:0,collapsed:false}],
  },null,2);
  const teamCard=(id,title)=>JSON.stringify({
    id,title,description:'',labelIds:[],memberIds:[],priority:'none',dueDate:null,
    checklist:[],attachments:[],comments:[],createdBy:'Harness',createdAt:stamp,
    lastModifiedBy:'Harness',lastModifiedAt:stamp,updatedAt:stamp,
  },null,2);
  const stores={
    fsa:new Map([
      ['boards/folder-board.kanzen.json',board('folder-board','Folder Board')],
      ['kanzen-settings.json',JSON.stringify({theme:'light',lastBoardId:'folder-board',version:1})],
    ]),
    crate:new Map([
      ['boards/crate-team/',''],
      ['boards/crate-team/_board.json',teamBoard],
      ['boards/crate-team/cards/crate-card.json',teamCard('crate-card','Initial team card')],
      ['boards/crate-team/cards/crate-card-2.json',teamCard('crate-card-2','Second team card')],
      ['boards/crate-team/_activity.jsonl',''],
      ['kanzen-settings.json',JSON.stringify({theme:'light',lastBoardId:'crate-board',version:1})],
    ]),
  };
  let active='fsa';
  let subscriptionCounter=0;
  const subscriptions=new Map();
  const caps=()=>({
    type:'naklios:capabilities',fs:true,fsBackend:active,
    fsBackends:[
      {id:'fsa',label:'Folder',name:'Harness Folder'},
      {id:'crate',label:'Crate',name:'Harness Crate'},
    ],
  });
  const send=message=>frame.contentWindow.postMessage(message,'*');
  const emitExternal=(backend,path)=>{
    for(const [subscriptionId,sub] of subscriptions){
      if(sub.backend!==backend) continue;
      const prefix=String(sub.path||'').replace(/\/+$/,'');
      if(prefix&&path!==prefix&&!path.startsWith(prefix+'/')) continue;
      send({type:'naklios:fs:event',subscriptionId,event:{op:'update',backend,path,source:'harness-external'}});
    }
  };
  const waitFor=(check,label,timeout=12000)=>new Promise((resolve,reject)=>{
    const started=performance.now();
    const poll=()=>{
      let value=null;
      try{ value=check(); }catch(_){}
      if(value){ resolve(value); return; }
      if(performance.now()-started>=timeout){ reject(new Error('Timed out waiting for '+label)); return; }
      setTimeout(poll,40);
    };
    poll();
  });
  const setStatus=(text,state='')=>{ status.textContent=text; status.dataset.state=state; };

  window.addEventListener('message',event=>{
    if(event.source!==frame.contentWindow) return;
    const msg=event.data;
    if(!msg||typeof msg!=='object') return;
    if(msg.type==='naklios:ready'||msg.type==='naklios:capabilities-request'){
      send(caps());
      return;
    }
    if(!String(msg.type||'').startsWith('naklios:fs:')) return;
    const op=msg.type.slice('naklios:fs:'.length);
    if(op==='unsubscribe'){
      subscriptions.delete(msg.subscriptionId);
      return;
    }
    const reply={type:'naklios:fs:reply',requestId:msg.requestId};
    try{
      if(op==='selectBackend'){
        if(!stores[msg.backend]) throw new Error('Unknown backend');
        active=msg.backend;
        reply.result=true;
        send(caps());
      }else{
        const store=stores[active];
        if(op==='subscribe'){
          const id='sub-'+(++subscriptionCounter);
          subscriptions.set(id,{backend:msg.backend||active,path:msg.path||''});
          reply.result=id;
        }else if(op==='list') reply.result=[...store.keys()].filter(path=>path.startsWith(String(msg.prefix||'')));
        else if(op==='exists') reply.result=store.has(msg.path);
        else if(op==='read'){
          if(!store.has(msg.path)) throw new Error('Not found');
          reply.result=store.get(msg.path);
        }else if(op==='write'){ store.set(msg.path,String(msg.data)); reply.result=null; }
        else if(op==='append'){
          store.set(msg.path,(store.get(msg.path)||'')+String(msg.line||'')+'\n');
          reply.result=null;
        }else if(op==='delete'){ store.delete(msg.path); reply.result=null; }
        else throw new Error('Unsupported '+op);
      }
    }catch(error){ reply.error=error.message; }
    send(reply);
  });
  frame.addEventListener('load',()=>send(caps()));

  async function runRegression(){
    run.disabled=true;
    setStatus('Running · loading Folder library…');
    try{
      active='fsa';
      send(caps());
      const app=frame.contentDocument;
      await waitFor(()=>app.body.textContent.includes('Folder Board'),'Folder board');
      app.getElementById('storage-hint').click();
      const crateChoice=await waitFor(
        ()=>[...app.querySelectorAll('#hosted-storage-choices button')]
          .find(button=>button.textContent.includes('Crate')),
        'Crate storage choice',
      );
      crateChoice.click();
      await waitFor(()=>app.body.textContent.includes('Crate Board'),'Crate board');
      if(app.body.textContent.includes('Folder Board')) throw new Error('Folder board leaked into Crate view');
      if(stores.crate.has('boards/folder-board.kanzen.json')) throw new Error('Folder board was copied to Crate');
      if(!stores.fsa.has('boards/folder-board.kanzen.json')) throw new Error('Folder board was removed');

      setStatus('Running · checking live team-card propagation…');
      await waitFor(
        ()=>[...subscriptions.values()].some(sub=>sub.backend==='crate'&&sub.path==='boards'),
        'Crate live subscription',
      );
      stores.crate.set('boards/crate-team/cards/crate-card.json',teamCard('crate-card','Live team update arrived'));
      emitExternal('crate','boards/crate-team/cards/crate-card.json');
      await waitFor(()=>app.body.textContent.includes('Live team update arrived'),'live team card update');

      setStatus('Running · checking non-overlapping team edits merge…');
      const liveWindow=frame.contentWindow;
      const liveBoard=liveWindow.S.boards[liveWindow.S.currentBoardId];
      liveBoard.cards['crate-card'].title='Local pending team edit';
      liveBoard.cards['crate-card'].updatedAt=new Date().toISOString();
      liveBoard._dirtyCards=new Set(['crate-card']);
      liveWindow.S.dirty=true;
      stores.crate.set('boards/crate-team/cards/crate-card-2.json',teamCard('crate-card-2','Remote second-card edit'));
      emitExternal('crate','boards/crate-team/cards/crate-card-2.json');
      await waitFor(
        ()=>app.body.textContent.includes('Local pending team edit')&&app.body.textContent.includes('Remote second-card edit'),
        'non-overlapping team merge',
      );
      if(app.getElementById('kz-overlay').classList.contains('open')) throw new Error('Non-overlapping team edits prompted as a conflict');

      setStatus('Running · checking crafted import IDs cannot execute…');
      const appWindow=frame.contentWindow;
      const current=appWindow.S.boards[appWindow.S.currentBoardId];
      const maliciousId="x');document.body.dataset.kanzenProbe='triggered';//";
      current.columns.push({id:maliciousId,name:'Crafted column',cardIds:[],wipLimit:0,collapsed:false});
      const validation=appWindow.validateBoardPayload(current);
      if(validation.ok) throw new Error('Crafted column ID passed import validation');
      delete app.body.dataset.kanzenProbe;
      appWindow.renderAll();
      const craftedColumn=[...app.querySelectorAll('.column')].find(column=>column.dataset.columnId===maliciousId);
      if(!craftedColumn) throw new Error('Crafted column did not render for execution regression');
      craftedColumn.querySelector('.add-card-btn').click();
      await new Promise(resolve=>setTimeout(resolve,50));
      if(app.body.dataset.kanzenProbe==='triggered') throw new Error('Crafted column ID executed JavaScript');
      app.getElementById('kz-cancel').click();
      current.columns=current.columns.filter(column=>column.id!==maliciousId);
      appWindow.renderAll();

      setStatus('PASS · storage isolation, team live updates, and crafted-ID execution checks passed','pass');
    }catch(error){
      console.error(error);
      setStatus('FAIL · '+error.message,'fail');
    }finally{ run.disabled=false; }
  }
  run.addEventListener('click',runRegression);
  if(new URLSearchParams(location.search).get('autorun')==='1'){
    frame.addEventListener('load',()=>setTimeout(runRegression,0),{once:true});
  }
})();
</script>
</body>
</html>
