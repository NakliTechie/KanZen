name: Test

# The app's own lanes. Until 2026-09-24 only vendor-sdk.yml ran here, and the storage lane sat red
# from the SDK adoption until the durability change noticed it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the vendor job dispatches this after an SDK refresh

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: test-naklios-storage.mjs
        run: node scripts/test-naklios-storage.mjs
      - name: test-team-merge.mjs
        run: node scripts/test-team-merge.mjs
      - name: test-card-review.mjs
        run: node scripts/test-card-review.mjs
      # Agent face: the parity lint (manifest covers the command bus) and its self-test, then the
      # browser suite that drives every door. Test tooling only; index.html ships with no dependencies.
      - name: npm ci (test tooling in scripts/)
        run: npm ci
        working-directory: scripts
      - name: lint-agent-face.mjs
        run: node scripts/lint-agent-face.mjs
      - name: test-lint-agent-face.mjs
        run: node scripts/test-lint-agent-face.mjs
      - name: Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium
        working-directory: scripts
      - name: test-agent-face.mjs
        run: node scripts/test-agent-face.mjs
